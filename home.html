<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">

  
<body>

    <div class="container">


        <form action="">
            <p>Currency Converter</p>


            <input type="text" id="amount" placeholder="Enter amount" required>

            <div class="country">

                <div class="from-div1">
                    <div class="from-div">
                    <div>From:</div>
                    <img id="flag" src="https://flagcdn.com/48x36/us.png" class="from-img"/>
                    <select name="from-select" id="from">

                        <!-- <option value="US">USD</option>
                        <option value="EU">EUR</option>
                        <option value="GB">GBP</option> -->

                    </select>
                </div>
                </div>
                <div class="to-div1">

                    <div class="to-div">
                        <div>To:</div>
                        <img id="flag" src="https://flagcdn.com/48x36/bd.png" class="to-img"/>
                        <select name="to-select" id="to">

                            <!-- <option value="US">USD</option>
                            <option value="EU">EUR</option>
                            <option value="GB">GBP</option> -->

                        </select>
                    </div>
                </div>
                    




            </div>

            

            <p class="show-msg"></p>

            <button type="button" class="convert-btn">Convert</button>








        </form>












    </div>
















<!-- <script src="data.js"></script> -->
<script src="logic.js" type="module"></script>   
</body>
</html>
